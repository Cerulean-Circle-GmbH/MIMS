services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${SCENARIO_NAME}_mailpit_container
    restart: unless-stopped
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/data
      - ${SCENARIO_SRC_SECRETSDIR}/${SCENARIO_MAILPIT_AUTHFILE}:/run/secrets/mailpit-auth:ro
    ports:
      - "${SCENARIO_RESOURCE_WEBUIPORT}:8025"
      - "${SCENARIO_RESOURCE_SMTPPORT}:1025"
    environment:
      - MP_MAX_MESSAGES=${SCENARIO_MAILPIT_MAXMESSAGES}
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_FILE=/run/secrets/mailpit-auth
      - MP_SMTP_AUTH_ALLOW_INSECURE=${SCENARIO_MAILPIT_SMTPAUTHALLOWINSECURE}
      - MP_UI_AUTH_FILE=/run/secrets/mailpit-auth
